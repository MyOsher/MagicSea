# Central config for the POC. Edit here, not in the scripts.

# --- Region: Mediterranean Sea (small box = fast download) ---
region:
  name: "mediterranean"
  lon_min: 2.0
  lon_max: 9.0
  lat_min: 38.0
  lat_max: 43.0

# --- Time window: two weeks of history (Week 1 goal) ---
time:
  start: "2023-06-01"
  end: "2023-06-14"

# --- Variable of interest ---
# VHM0 = spectral significant wave height (meters). High operational value
# (shipping, marine energy, insurance) and still a single scalar field.
# Default = Mediterranean wave product (4.2 km), matching the region above.
# Global alternative: "cmems_mod_glo_wav_anfc_0.083deg_PT3H-i".
# Confirm the exact id/variable in the catalog before downloading:
#   https://data.marine.copernicus.eu/product/MEDSEA_ANALYSISFORECAST_WAV_006_017
variable:
  short_name: "wave"                     # name used inside our code
  copernicus_var: "VHM0"                 # variable name inside the NetCDF
  copernicus_dataset_id: "cmems_mod_med_wav_anfc_4.2km_PT1H-i"

# --- Preprocessing ---
preprocess:
  target_size: 64        # THE key speed tip: downsample maps to 64x64
  auto_celsius: true     # auto-convert Kelvin -> Celsius when values look like Kelvin

paths:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  output_dir: "output"
